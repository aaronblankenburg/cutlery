# Unit tests on every push and pull request (the browser and integration tests need Chrome, Docker and footage
# and run locally, see README.md). Actions are pinned to commit SHAs.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ffmpeg (the tests generate small clips)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python packages
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt
      - name: "Unit tests (also: compose.yaml, .env.example and the Dockerfile agree, tests/unit/test_deploy.py)"
        run: .venv/bin/pytest -q tests/unit
