# nginx server block for Cutlery on its own subdomain, with HTTPS.
# Copy to /etc/nginx/sites-available/cutlery, replace cutlery.example.org and the certificate paths
# (for example from certbot: certbot --nginx -d cutlery.example.org), link it into sites-enabled, then
#   nginx -t && systemctl reload nginx
# Cutlery listens on 127.0.0.1:8080 (CUTLERY_BIND, CUTLERY_PORT in .env) and asks for the password itself
# (HTTP Basic Auth on every page, upload and download); nginx only adds HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name cutlery.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cutlery.example.org;

    ssl_certificate     /etc/letsencrypt/live/cutlery.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cutlery.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads arrive in pieces of 8 MiB (tus); music and storyboard files the same way.
    client_max_body_size 64m;
    # Pass upload pieces and downloads through as they come instead of buffering them on disk.
    proxy_request_buffering off;
    proxy_buffering off;
    # Large uploads on slow lines, long job logs (server-sent events), export packages that take a while to build.
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Cutlery counts failed logins per client address (lockout); it trusts this header from 127.0.0.1 only
        # (CUTLERY_TRUSTED_PROXIES).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
