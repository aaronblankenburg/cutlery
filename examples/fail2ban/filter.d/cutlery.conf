# fail2ban filter for failed Cutlery logins.
# Cutlery logs every failed login with the client address (behind a reverse proxy: the address the proxy passes in
# X-Real-IP), for example:
#   2026-11-16 22:31:07,412 WARNING cutlery.auth: cutlery: login failed from 203.0.113.7
# Docker stores the container's output as JSON lines; the time stamp is Docker's.

[INCLUDES]
before = common.conf

[Definition]
failregex = cutlery: login failed from <ADDR>\b
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
              ^%%Y-%%m-%%d %%H:%%M:%%S
