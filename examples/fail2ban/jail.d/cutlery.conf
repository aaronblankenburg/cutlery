# fail2ban jail for Cutlery. Copy filter.d/cutlery.conf to /etc/fail2ban/filter.d/ and this file to
# /etc/fail2ban/jail.d/, then:  systemctl reload fail2ban;  fail2ban-client status cutlery
#
# Cutlery itself already locks an address out for 15 minutes after 20 failed logins; fail2ban bans it at the
# firewall for longer. The ban blocks HTTP and HTTPS on this host, where the reverse proxy listens. If your reverse
# proxy runs in a Docker container with published ports, use `chain = DOCKER-USER` (see the comment below).

[cutlery]
enabled  = true
filter   = cutlery
# Docker's default log driver writes one JSON file per container. With the journald log driver, use instead:
#   backend = systemd
#   journalmatch = CONTAINER_NAME=cutlery-cutlery-1
backend  = auto
logpath  = /var/lib/docker/containers/*/*-json.log
port     = http,https
maxretry = 10
findtime = 10m
bantime  = 6h
# chain = DOCKER-USER
